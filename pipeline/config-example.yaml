asr:
  url: "http://localhost:8100"               # parakeet-asr-server

conversation:
  backend: "agentic"                           # "agentic" (e.g. OpenClaw, with tools) or "conversational" (plain chat)
  pause_flush_s: 0.8                           # play a held sentence if the agent's text pauses this long (0 = wait for the next sentence)

  stall:
    enabled: true                              # decide if a stall phrase is needed while the agent works
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-2.5-flash"
    reasoning_effort: "none"                   # disable thinking for sub-second latency (Gemini 2.5 Flash only)
    max_tokens: 200
    timeout: 1.5                               # seconds; skip stall if slower than this
    prompt: |
      You are the bridge voice for a voice assistant — a short, natural
      utterance you speak immediately while the real assistant starts
      working. Your job is to decide whether the user's latest
      utterance needs one, and if so, to say it.

      {recent_context}

      The user just said: {user_text}

      If the assistant can answer entirely from its own knowledge or
      creativity — facts, opinions, jokes, explanations, general
      knowledge, small talk, a partial thought, or a request to keep
      talking — output the literal word NONE. The assistant is itself
      a capable language model and doesn't need bridge audio for
      anything it can just answer. Note: a follow-up that changes a
      parameter in a previous lookup is a fresh lookup, not small talk.

      Otherwise the assistant is about to do slow agentic work — a
      live lookup, a file or API call, or an action like scheduling,
      saving, sending, remembering, updating something — and you
      should speak a brief, warm bridge phrase while that runs. Two
      situations:

      Asking FOR information. React naturally and signal you're going
      to go look. Roughly three to seven words, friend energy, specific
      to what the user actually mentioned — use the name of the place,
      person, or thing instead of vague filler. Never predict the
      answer.

      Asking you to DO something. You are ONLY the bridge voice —
      you have no authority to commit to the action, and the real
      agent will confirm it itself once it's done.

      Your job: speak a short listener-sound that tells the user
      "I heard you" without actually responding to the substance of
      their request. Two to five words, warm and natural, like the
      reaction a friend gives mid-conversation to show they're
      following. It should feel like a backchannel, not a reply.

      Content test you must pass: if a third party read ONLY your
      phrase, without the user's message, they should be unable to
      guess what the user asked for. That means:
      - No verb form of the action — no "adding", "saving",
        "scheduling", "sending", "marking", "reminding", "noting",
        "creating", "updating", "setting up", "putting", etc.
      - No naming of the thing being acted on.
      - No "I'll", "I will", "let me", "I'm going to", "on it",
        "will do", "right away".

      The common failure mode is helpfully narrating the action
      ("Okay, adding that…", "Sure, I'll remember that…") — that
      is exactly what NOT to do, because you cannot honestly make
      that promise. Stay content-free.

      Write fresh each time — don't reach for stock phrases. Match the
      user's register: relaxed if they were relaxed, brisk if they
      were brisk. Keep it under seven words either way. End with
      normal spoken punctuation.

      Output ONLY the spoken phrase, or the literal word NONE. No
      quotes, no explanation, no preamble.

  agentic:
    base_url: "http://127.0.0.1:18789/v1"   # OpenClaw gateway
    api_key: "${OPENCLAW_GATEWAY_TOKEN}"     # env var reference
    model: "openclaw/default"
    max_tokens: 300
    message_channel: "onju-voice"            # x-openclaw-message-channel header
    # provider_model: "anthropic/claude-opus-4-6"  # optional: override backend LLM
    voice_prompt: >-                            # prepended to every user message as a reminder
      [voice: this is spoken input transcribed from a microphone and your entire
      response will be read aloud by TTS on a small speaker. Write only plain
      spoken prose — no markdown, no lists, no structured reports, no code. If
      your research produces detailed findings, save them to a file and just
      give a brief spoken summary. Remember, keep it conversational.]

  conversational:
    base_url: "https://openrouter.ai/api/v1"  # OpenRouter, Ollama, mlx_lm.server, Gemini, etc.
    api_key: "${OPENROUTER_API_KEY}"           # set key or use ${ENV_VAR} reference
    model: "anthropic/claude-haiku-4.5"
    max_messages: 20
    max_tokens: 300
    system_prompt: "You are a helpful voice assistant. Keep responses concise (under 2 sentences)."
    persist_dir: "data/conversations"          # per-device message history (omit to disable)
    # Fully local example (Ollama):
    # base_url: "http://localhost:11434/v1"
    # api_key: "none"
    # model: "gemma4:e4b"

tts:
  backend: "elevenlabs"                      # "local" or "elevenlabs" (cloud)
  local:
    url: "http://localhost:8880"
    model: "mlx-community/Qwen3-TTS-12Hz-1.7B-Base-4bit"
    ref_audio: ""
    ref_text: ""
    # Optional, for qwen3-tts-new (ruby-stack): sent only when set, so leave
    # them out for Kokoro. Greedy + a fixed seed = the same audio every time.
    # temperature: 0.1
    # top_k: 1
    # top_p: 1.0
    # do_sample: false
    # repetition_penalty: 1.2
    # seed: 7
  elevenlabs:
    api_key: ""                              # your ElevenLabs API key
    default_voice: "Archer"
    default_voice_ptt: "Emma"                # PTT devices (smaller speaker)
    voices:
      Archer: "Fahco4VZzobUeiPqni1S"        # British conversational male
      Emma: "56bWURjYFHyYyVf490Dp"          # female, better on small speakers
      Rachel: "21m00Tcm4TlvDq8ikWAM"        # add your voice IDs here

vad:
  threshold: 0.5                             # speech onset probability
  neg_threshold: 0.35                        # speech offset probability (hysteresis)
  # silence_time: end-of-utterance pause (s), decided on the server (no
  # firmware setting): this much silence after speech ends the request and
  # sends it off. Longer lets you hesitate mid-request without it being cut
  # short, at the cost of that much more delay before every reply starts.
  # Takes effect on a server restart. (Speech while the turn is still
  # thinking is merged into it anyway, see Attention below.)
  silence_time: 1.5
  pre_buffer_s: 1.0
  # VOX barge-in (talking over the reply to interrupt it). PTT pods always
  # interrupt on a button press, these don't apply to them.
  interrupt_min_ms: 300                      # continuous speech needed to interrupt (0 = first frame over threshold)
  interrupt_only_while_playing: true         # only while the pod plays the reply, not while waiting for ASR / the agent
  # Attention (pipeline/attention.py): the voice LEDs flash exactly while the
  # server listens to the mic. During a turn it keeps listening until the
  # turn's first audio (stall line or answer) starts playing: speech in that
  # window cancels the pending request and resends it merged with what you
  # added. From playback start it listens only while barge-in is armed (per
  # the two settings above); otherwise speech has no effect at all and the
  # pod's mic is closed (0xDD 0) until the final sentence reopens it.

network:
  udp_port: 3000
  tcp_port: 3001
  multicast_group: "239.0.0.1"
  multicast_port: 12345
  control_port: 3002

# Say endpoint (optional, off by default): POST /say makes the pod speak a
# given text in a given TTS voice, without a voice turn (announcements,
# filming), on its own small HTTP server. Without this section, or with
# enabled: false, nothing listens and turns work exactly as before.
# The pod is refused (HTTP 409) while it is in a turn, playing, recording
# or listening. Every say is logged to `log` (one JSON line each); it is not
# passed to the agent. See pipeline/say.py for the request fields, e.g.:
#   curl -X POST http://127.0.0.1:3104/say -H 'Content-Type: application/json' \
#     -d '{"voice": "pepper", "text": "Dinner is ready."}'
# say:
#   enabled: true
#   host: "127.0.0.1"                        # 0.0.0.0 = reachable from the LAN (then set a token)
#   port: 3104                               # default 3104 (onju-grok uses 3103 on the same host)
#   token: ""                                # optional: then send "Authorization: Bearer <token>"
#   log: "/tmp/tts-debug/say.log"            # JSON lines: time, device, voice, status, text
#   render: sentence                         # sentence (default): render+play one sentence at a time;
#                                            # whole: render all sentences, then play them back to back
#                                            # (no gaps); only with tts.backend local, ignored otherwise

audio:
  sample_rate: 16000
  chunk_size: 512                            # 32ms at 16kHz (matches ESP32 SAMPLE_CHUNK_SIZE)
  opus_frame_size: 320                       # 20ms at 16kHz

device:
  default_volume: 15
  # default_mic_timeout: how long (s) the pod keeps its mic open after the
  # reply's last sentence. The pod opens it for at least 20 s after any
  # playback with a nonzero mic timeout (MIC_LISTEN_MS in onjuino.ino), so
  # values under 20 act as 20. Only 0 ("keep it closed", sent for every
  # sentence but the last) is honored exactly, from firmware 20261019 on;
  # the server also sends 0xDD 0 after those sentences for older firmware.
  default_mic_timeout: 60
  led_fade: 2
  led_power: 50
  led_update_period: 0.25
  greeting: false
  greeting_wav: "data/hello_imhere.wav"
  # mic_holdoff_ms: how long the pod stays deaf right after it stops talking.
  #
  # Why it exists (found 2026-10-11): the pod can't listen while it speaks,
  # and its mic buffer isn't read during playback. The moment playback ends,
  # the first ~128 ms it sends are therefore the end of its OWN voice, plus a
  # bit of speaker/room ring-down. In VOX mode the server took that as speech:
  # ASR heard "Thank you." (dropped as no speech, which then reopened the mic
  # for default_mic_timeout = a 60 s 'busy' pod) or "Bye." (a real turn to
  # the default agent). With the holdoff, the pod reads and throws away mic
  # audio for this many ms after playback, so it never hears itself.
  #
  # Trade-off: anything said in that window after the pod stops is lost.
  # A tap skips the holdoff (mic opens at once); PTT pods never use it.
  #
  # How it gets to the pod: the server sends it as the 0xEF settings command
  # (setting id 1) each time a pod announces itself. Unset = nothing is sent
  # and the pod keeps its firmware default of 256 ms. Range 0..2000 ms.
  #   64 / 128  too short to clear the 128 ms stale buffer; not recommended
  #   256       normal use (firmware default)
  #   512       extra safe, e.g. while filming
  # Needs firmware from 2026-10-11 or later. Older firmware doesn't know 0xEF:
  # it flashes red once and drops that one connection (harmless), so leave
  # this unset until the pods are reflashed.
  # mic_holdoff_ms: 256
  #
  # prebuffer_ms: how much audio the pod buffers before it starts playing
  # each stream (each sentence / WAV the server sends it).
  #
  # Why it exists (added 2026-10-12): the pod plays audio as it arrives over
  # Wi-Fi, from a 1 s buffer. When a Wi-Fi packet is lost, TCP stalls until it
  # is resent; a stall longer than the buffer runs it dry and you hear a
  # silent gap ("underrun") in the middle of a sentence. Filming on a lossy
  # pod link (~20% loss measured) made that happen a lot.
  #
  # What it does: the pod waits until it holds this much audio (or the stream
  # ends) before it starts playing. A stream SHORTER than the buffer is fully
  # downloaded first and then played from memory: effectively WAV-file
  # playback, a Wi-Fi hiccup can only delay its start, never cut into it. A
  # stream longer than the buffer starts once the buffer is full and keeps
  # streaming the rest, exactly as with the 1 s default.
  #
  # Trade-off: it delays the START of every stream by up to this much, normal
  # voice replies included, and it defeats tts.backend local_stream (which
  # exists to start speaking early). Use large values only for filming /
  # announces, with tts.backend local + say.render whole (every sentence is
  # rendered before it is sent, so it arrives fast and plays back to back).
  #
  # How it gets to the pod: 0xEF settings command, setting id 2, sent each
  # time a pod announces itself (with mic_holdoff_ms). Unset = nothing is sent
  # and the pod keeps 1000 ms. Range 64..30000 ms (both server and pod clamp);
  # 30 s is what the pod's buffer is sized for (~1.9 MB of its 8 MB PSRAM).
  #   unset / 1000   normal use (firmware default)
  #   15000          filming: any sentence under 15 s plays gap-free
  # Needs firmware from 2026-10-12 or later. Firmware from 2026-10-11 logs and
  # ignores unknown setting ids (harmless, keeps 1000 ms). Firmware older than
  # 2026-10-11 doesn't know 0xEF: it flashes red once and drops that one
  # connection.
  # prebuffer_ms: 1000

logging:
  level: "INFO"

# Debug WAVs: every spoken sentence is also saved to /tmp/tts-debug as
# YYYYMMDD-HHMMSS_<voice>_<first 30 characters>.wav, with "__" before the
# text for a stall or filler line (same second: -2, -3 ... added). The time is local:
# the TZ env var's zone if set, else debug.tz, else America/Los_Angeles.
# debug:
#   tz: "America/Los_Angeles"
